name: Docker

# Replaces docker-check.yaml + trivy-scan.yaml, which each built their own copy
# of the image -- two full Docker builds per push and per pull request. This
# builds once and scans that image.
#
# Uses pull_request (not pull_request_target) on purpose: it builds untrusted
# fork PR code and needs neither repo secrets nor a write-scoped GITHUB_TOKEN,
# so the default read-only, secret-less fork token is enough.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.dockerignore'
      - '.github/workflows/docker.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.dockerignore'
      - '.github/workflows/docker.yaml'
  schedule:
    # A vulnerability in a base-image package appears without anyone touching
    # the repository, so the scan also runs on its own once a week.
    - cron: '0 4 * * 1'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: without this block the job runs with whatever the repository
# default is, which on older repos is read AND write for the whole token -- in a
# job that builds code straight out of the checkout.
permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true                  # keep it in the local daemon for Trivy
          tags: mediaforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master @ 2026-07
        with:
          image-ref: 'mediaforge:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
