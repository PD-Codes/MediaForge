name: Provider contracts

# Detect a provider layout change before users do.
#
# Deliberately NOT part of ci.yaml. The live half of this touches third-party
# sites, so it fails for reasons that have nothing to do with the pull request
# in front of it: the site is down, rate-limiting the runner, or showing a bot
# wall. A check that fails for reasons the author cannot fix is a check the
# team learns to ignore, and then to disable.
#
# So it runs on a schedule and reports by opening an issue. The offline half
# (parsing the recorded fixtures) does run in ci.yaml, as part of the normal
# suite, because that one catches OUR regressions and never touches the
# network.

on:
  schedule:
    # 05:20 UTC daily. Off the hour on purpose: every scheduled workflow on
    # GitHub fires at :00, and the queue there is where a five-minute job goes
    # to wait twenty.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live-contracts:
    name: Live provider check
    runs-on: ubuntu-latest
    # One provider being unreachable must not hide the state of the others.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install .[test]

      - name: Check every recorded provider against the live site
        id: contracts
        env:
          MEDIAFORGE_CONTRACT_LIVE: "1"
        run: |
          set -o pipefail
          python -m pytest tests/test_provider_contracts.py -q \
            -k live 2>&1 | tee contract-report.txt

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-contract-report
          path: contract-report.txt
          retention-days: 14

      - name: Open an issue when a provider stopped parsing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(no report captured)';
            try { report = fs.readFileSync('contract-report.txt', 'utf8').slice(-6000); }
            catch (e) { /* the step failed before pytest wrote anything */ }

            const title = 'Provider contract check failed';
            // Reuse the open issue instead of opening one a day. A daily
            // duplicate is how this notification stops being read.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'provider-contract',
            });

            const body = [
              'The scheduled live provider check failed.',
              '',
              'This usually means a site changed its markup and the parser no',
              'longer finds episodes — the same failure users see as',
              '"could not read the series page" in Auto-Sync.',
              '',
              'Fix the parser, then re-record the fixture:',
              '',
              '```',
              'python tests/contracts/record.py <provider> <series url>',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '<details><summary>Report</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
            ].join('\n');

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['provider-contract'],
                body,
              });
            }
