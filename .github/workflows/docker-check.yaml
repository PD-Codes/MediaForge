name: Test Build Docker

# Uses pull_request (not pull_request_target) on purpose: this job checks out
# and builds untrusted fork PR code, and does not need repo secrets or a
# write-scoped GITHUB_TOKEN, so it runs safely with the default read-only,
# secret-less fork token.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - '.dockerignore'

# Least privilege: without this block the job runs with whatever the repository
# default is, which on older repos is read AND write for the whole token -- in a
# job that builds code straight out of the checkout.
permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Test Docker build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: mediaforge:pr-test
