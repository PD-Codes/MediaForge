name: Test Build Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: without this block the job runs with whatever the repository
# default is, which on older repos is read AND write for the whole token -- in a
# job that builds code straight out of the checkout.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install .[test]
          pip install pyinstaller

      - name: Run tests
        # Route smoke test + the authorisation regression tests. Runs against a
        # throwaway MEDIAFORGE_CONFIG_DIR (see tests/conftest.py), so nothing
        # here touches a real installation.
        run: pytest

      - name: Build executable
        run: pyinstaller mediaforge.spec
